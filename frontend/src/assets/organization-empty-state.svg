<svg width="380" height="260" viewBox="0 0 380 260"  xmlns="http://www.w3.org/2000/svg">
  <title>Organization empty state</title>
  <desc>An empty organization illustration showing an office building with an add button, clouds and subtle decorative elements.</desc>

  <defs>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(240 175) rotate(90) scale(125)">
      <stop offset="0" stop-color="currentColor" stop-opacity=".10"/>
      <stop offset="1" stop-color="currentColor" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="building" x1="240" y1="92" x2="240" y2="270" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="currentColor" stop-opacity=".18"/>
      <stop offset="1" stop-color="currentColor" stop-opacity=".07"/>
    </linearGradient>

    <linearGradient id="sideBuilding" x1="150" y1="160" x2="150" y2="270" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="currentColor" stop-opacity=".13"/>
      <stop offset="1" stop-color="currentColor" stop-opacity=".055"/>
    </linearGradient>

    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Soft background halo -->
  <circle cx="240" cy="170" r="125" fill="url(#halo)"/>

  <!-- Decorative dots -->
  <circle cx="142" cy="108" r="6" fill="currentColor" fill-opacity=".16"/>
  <circle cx="246" cy="98" r="5" fill="currentColor" fill-opacity=".16"/>
  <circle cx="254" cy="123" r="7" fill="currentColor" fill-opacity=".13"/>
  <circle cx="140" cy="212" r="6" fill="currentColor" fill-opacity=".13"/>
  <circle cx="345" cy="210" r="5" fill="currentColor" fill-opacity=".12"/>

  <!-- Clouds -->
  <g fill="currentColor">
    <circle cx="161" cy="172" r="20" fill-opacity=".09"/>
    <circle cx="180" cy="160" r="27" fill-opacity=".09"/>
    <circle cx="201" cy="174" r="20" fill-opacity=".09"/>
    <rect x="154" y="170" width="54" height="20" rx="10" fill-opacity=".09"/>

    <circle cx="320" cy="142" r="17" fill-opacity=".09"/>
    <circle cx="338" cy="133" r="24" fill-opacity=".09"/>
    <circle cx="358" cy="147" r="18" fill-opacity=".09"/>
    <rect x="315" y="144" width="48" height="18" rx="9" fill-opacity=".09"/>
  </g>

  <!-- Ground shadow -->
  <ellipse cx="240" cy="278" rx="105" ry="13"
    fill="currentColor" fill-opacity=".10" filter="url(#soft)"/>
  <ellipse cx="240" cy="276" rx="108" ry="10"
    fill="currentColor" fill-opacity=".08"/>

  <!-- Left building -->
  <path
    d="M112 183L154 169C158 168 162 171 162 176V267H112V183Z"
    fill="url(#sideBuilding)"
    stroke="currentColor"
    stroke-opacity=".08"
  />
  <rect x="128" y="204" width="12" height="20" rx="2"
    fill="currentColor" fill-opacity=".10"/>
  <rect x="128" y="235" width="12" height="20" rx="2"
    fill="currentColor" fill-opacity=".10"/>

  <!-- Right building -->
  <path
    d="M318 170L361 183V267H311V176C311 171 314 169 318 170Z"
    fill="url(#sideBuilding)"
    stroke="currentColor"
    stroke-opacity=".08"
  />
  <rect x="335" y="204" width="12" height="20" rx="2"
    fill="currentColor" fill-opacity=".10"/>
  <rect x="335" y="235" width="12" height="20" rx="2"
    fill="currentColor" fill-opacity=".10"/>

  <!-- Main building top -->
  <rect x="211" y="94" width="58" height="31" rx="11"
    fill="currentColor" fill-opacity=".12"/>

  <!-- Main building -->
  <rect x="176" y="119" width="128" height="149" rx="15"
    fill="url(#building)"
    stroke="currentColor"
    stroke-opacity=".13"
    stroke-width="2"
  />

  <!-- Windows -->
  <g fill="currentColor" fill-opacity=".12">
    <rect x="198" y="144" width="18" height="18" rx="3"/>
    <rect x="231" y="144" width="18" height="18" rx="3"/>
    <rect x="264" y="144" width="18" height="18" rx="3"/>

    <rect x="198" y="178" width="18" height="18" rx="3"/>
    <rect x="231" y="178" width="18" height="18" rx="3"/>
    <rect x="264" y="178" width="18" height="18" rx="3"/>
  </g>

  <!-- Door -->
  <rect x="224" y="221" width="32" height="47" rx="5"
    fill="currentColor" fill-opacity=".16"/>

  <!-- Add organization button -->
  <circle cx="318" cy="246" r="35"
    fill="currentColor" fill-opacity=".13"
    stroke="currentColor"
    stroke-opacity=".20"
    stroke-width="2"
  />

  <path
    d="M318 232V260M304 246H332"
    stroke="currentColor"
    stroke-width="3"
    stroke-linecap="round"
    stroke-opacity=".75"
  />
</svg>
